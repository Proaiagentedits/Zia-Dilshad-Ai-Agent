<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zia Dilshad AI Academy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #0f0f0f; 
            color: white; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Course Section */
        .course-header {
            background: #161616;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #ffcc00;
        }
        .hero-title {
            font-size: 1.8rem;
            color: #ffcc00;
            margin-bottom: 5px;
            font-weight: 800;
        }
        .course-desc {
            font-size: 0.9rem;
            color: #bbb;
            margin-bottom: 15px;
        }

        /* Video Container - Working standard embed */
        .video-box {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
        }

        /* Main Chat Window Area (Just like your original setup) */
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f0f0f;
            padding: 15px;
        }

        #messagesEl { 
            flex: 1; 
            overflow-y: auto; 
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 20px;
        }

        .msg { 
            padding: 12px 16px; 
            border-radius: 14px; 
            max-width: 85%; 
            line-height: 1.4;
            font-size: 0.95rem;
        }
        
        .user { 
            background: #ffcc00; 
            color: #000;
            align-self: flex-end; 
            border-bottom-right-radius: 2px;
            font-weight: bold;
        }
        
        .bot { 
            background: #1a1a1a; 
            color: #fff;
            align-self: flex-start; 
            border-bottom-left-radius: 2px;
            border: 1px solid #222;
        }

        /* Fixed Footer Input Area */
        .input-area { 
            display: flex; 
            gap: 10px;
            background: #161616;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #222;
        }
        
        #inputEl { 
            flex: 1; 
            padding: 12px; 
            background: #222; 
            border: 1px solid #333; 
            border-radius: 8px; 
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        #inputEl:focus { border-color: #ffcc00; }
        
        #sendBtn { 
            padding: 12px 24px; 
            background: #ffcc00; 
            color: #000; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer;
        }
        #sendBtn:disabled { background: #555; color: #aaa; }
    </style>
</head>
<body>

    <!-- Course Section (Stays on Top) -->
    <div class="course-header">
        <h1 class="hero-title">PRO AI VIDEO EDITING COURSE</h1>
        <p class="course-desc">Master CapCut & Premiere Pro with Zia Dilshad. Click play to start learning inside the app!</p>
        
        <!-- Standard YouTube Embed that actually works inside the page -->
        <div class="video-box">
            <iframe width="100%" height="100%" src="https://www.youtube.com/embed/ScMzIvxBSi4" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Chat Area (Stays below the video, always visible) -->
    <div class="chat-section">
        <div id="messagesEl"></div>
        <div class="input-area">
            <input type="text" id="inputEl" placeholder="Message likho...">
            <button id="sendBtn">Send</button>
        </div>
    </div>

<script>
    const inputEl = document.getElementById('inputEl');
    const sendBtn = document.getElementById('sendBtn');
    const messagesEl = document.getElementById('messagesEl');
    let chatHistory = [];

    // Auto welcome message on screen load
    window.onload = () => {
        addMessage('{"reply":"Assalamualaikum! Main Zia Dilshad hoon❤️\\n\\nMain aapko CapCut aur Premiere Pro bilkul zero se sikhaunga. Step by step, 1 step at a time. 500+ students already seekh chuke hain ✅\\n\\nSubscription Fee: Sirf Rs. 99 - One Time\\n\\nJazzCash: 03046386644\\n\\n💯 GUARANTEE: Payment karte hi aapko mere is private AI teaching ka access 5 minutes k andr mil jayega\\n\\nPayment karte hi is no pr SS WhatsApp kar edin: 03046386644"}', 'bot');
    };

    function addMessage(rawText, who) {
        const div = document.createElement('div');
        div.className = 'msg ' + who;
        
        let cleanText = rawText;
        // Agar response me JSON framework ho to usay parse kar ke text nikalna
        if (who === 'bot') {
            try {
                if (rawText.startsWith('{')) {
                    const parsed = JSON.parse(rawText);
                    cleanText = parsed.reply;
                }
            } catch (e) {
                cleanText = rawText;
            }
            // \n ko line breaks me badalna
            cleanText = cleanText.replace(/\n/g, '<br />');
        }

        div.innerHTML = cleanText; 
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
    }

    async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        chatHistory.push({ role: "user", content: text });
        inputEl.value = '';
        sendBtn.disabled = true;

        const botMsgEl = addMessage('Thinking...', 'bot');

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: chatHistory })
            });

            const data = await res.json();

            if (data && data.reply) {
                // Purani textContent ki jagah innerHTML lagaya aur formatted text dala
                const formattedReply = data.reply.replace(/\n/g, '<br />');
                botMsgEl.innerHTML = formattedReply;
                chatHistory.push({ role: "assistant", content: data.reply });
            } else {
                botMsgEl.textContent = "Groq se sahi response nahi mila.";
            }
        } catch (e) {
            botMsgEl.textContent = "Server error aa gaya hai.";
        }

        sendBtn.disabled = false;
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    sendBtn.onclick = sendMessage;
    inputEl.onkeypress = e => { if (e.key === 'Enter') sendMessage(); };
</script>
</body>
</html>
