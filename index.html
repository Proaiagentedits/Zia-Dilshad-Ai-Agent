<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zia Dilshad AI Academy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #0a0a0a; 
            color: #fff; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Navigation Tabs */
        .tabs-nav {
            display: flex;
            background: #161616;
            border-bottom: 2px solid #222;
        }
        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        .tab-btn.active {
            color: #ffcc00;
            border-bottom: 3px solid #ffcc00;
            background: #1f1f1f;
        }

        /* Container for content */
        .tab-content {
            flex: 1;
            overflow-y: auto;
            display: none;
            padding: 20px;
        }
        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        /* Course View */
        .badge {
            background: #ffcc00; color: #000; padding: 5px 12px;
            font-weight: bold; border-radius: 20px; font-size: 0.8rem;
            align-self: flex-start; margin-bottom: 15px;
        }
        .hero-title { font-size: 2rem; color: #ffcc00; margin-bottom: 10px; }
        .course-desc { color: #aaa; margin-bottom: 20px; line-height: 1.4; }
        
        .video-container { 
            position: relative; width: 100%; aspect-ratio: 16/9;
            border-radius: 12px; overflow: hidden; background: #000;
            border: 1px solid #ffcc00; box-shadow: 0 0 10px rgba(255,204,0,0.2);
        }

        /* Chat View Fixed */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        #messagesEl { 
            flex: 1; overflow-y: auto; padding-bottom: 20px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .msg { padding: 12px; border-radius: 12px; max-width: 85%; line-height: 1.4; }
        .user { background: #ffcc00; color: #000; align-self: flex-end; }
        .bot { background: #1a1a1a; color: #fff; align-self: flex-start; border: 1px solid #222; }

        .input-area { 
            display: flex; gap: 10px; padding: 10px 0;
            background: #0a0a0a; border-top: 1px solid #222;
        }
        #inputEl { flex: 1; padding: 12px; background: #222; border: 1px solid #333; border-radius: 8px; color: #fff; outline: none; }
        #sendBtn { padding: 12px 20px; background: #ffcc00; color: #000; border: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Tabs Layout for Mobile/Web Perfect View -->
    <div class="tabs-nav">
        <button class="tab-btn active" onclick="switchTab('course-tab', this)">📖 View Course</button>
        <button class="tab-btn" onclick="switchTab('chat-tab', this)">💬 AI Teacher</button>
    </div>

    <!-- TAB 1: Course Details & Video -->
    <div id="course-tab" class="tab-content active">
        <div class="badge">LIVE COURSE ACTIVE</div>
        <h1 class="hero-title">PRO AI VIDEO EDITING</h1>
        <p class="course-desc">Master CapCut & Premiere Pro with Zia Dilshad. Tap below to start learning inside the app!</p>
        
        <div class="video-container" onclick="this.innerHTML='<iframe width=\'100%\' height=\'100%\' src=\'https://www.youtube.com/embed/k26_p445p0Y?autoplay=1\' frameborder=\'0\' style=\'position:absolute;top:0;left:0;width:100%;height:100%;\' allow=\'autoplay; encrypted-media\' allowfullscreen></iframe>'">
            <img src="https://img.youtube.com/vi/k26_p445p0Y/maxresdefault.jpg" style="width:100%; height:100%; object-fit:cover;" alt="Thumbnail">
            <div style="position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); display:flex; justify-content:center; align-items:center; font-weight:bold; color:#ffcc00;">▶ TAP TO PLAY VIDEO</div>
        </div>
    </div>

    <!-- TAB 2: 100% Working Chatbox -->
    <div id="chat-tab" class="tab-content">
        <div class="chat-container">
            <div id="messagesEl"></div>
            <div class="input-area">
                <input type="text" id="inputEl" placeholder="Type a message...">
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>

<script>
    // Tab switching logic
    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    const inputEl = document.getElementById('inputEl');
    const sendBtn = document.getElementById('sendBtn');
    const messagesEl = document.getElementById('messagesEl');
    let chatHistory = [];

    function addMessage(text, who) {
        const div = document.createElement('div');
        div.className = 'msg ' + who;
        div.innerHTML = text; 
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
    }

    async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        chatHistory.push({ role: "user", content: text });
        inputEl.value = '';
        sendBtn.disabled = true;

        const botMsgEl = addMessage('Thinking...', 'bot');

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: chatHistory })
            });

            const data = await res.json();

            if (data && data.reply) {
                const formattedReply = data.reply.replace(/\n/g, '<br />');
                botMsgEl.innerHTML = formattedReply;
                chatHistory.push({ role: "assistant", content: data.reply });
            } else {
                botMsgEl.textContent = "Groq se sahi response nahi mila.";
            }
        } catch (e) {
            botMsgEl.textContent = "Server error aa gaya hai.";
        }

        sendBtn.disabled = false;
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    sendBtn.onclick = sendMessage;
    inputEl.onkeypress = e => { if (e.key === 'Enter') sendMessage(); };
</script>
</body>
</html>
